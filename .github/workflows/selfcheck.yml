name: selfcheck

# 每周巡检公开数据接口是否失效；失效则自动开 Issue 报警。
# Fork 后无需配置即可生效。

on:
  schedule:
    - cron: "23 2 * * 1"   # 每周一 02:23 UTC（避开整点拥堵）
  workflow_dispatch:        # 允许手动触发

permissions:
  issues: write             # 用于自动开 Issue

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run selfcheck
        id: check
        run: python3 equity-research/scripts/selfcheck.py
        continue-on-error: true
      - name: Open issue on failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'selfcheck', per_page: 1,
            });
            const title = `⚠️ selfcheck 失败（${new Date().toISOString().slice(0,10)}）：公开数据接口疑似失效`;
            const body = `自动巡检发现接口异常。\n\n排查步骤：\n` +
              `1. 本地运行 \`python3 equity-research/scripts/selfcheck.py\` 定位失败项\n` +
              `2. 接口 URL/字段集中维护在 \`equity-research/scripts/endpoints.py\`，接口变动只需改这一个文件\n` +
              `3. 修复后关闭本 issue\n\n[失败运行详情](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['selfcheck'],
              });
            }
